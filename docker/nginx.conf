server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 64m;

    # Встроенный DNS Docker. Без него nginx резолвит имя апстрима один раз при старте
    # и намертво кеширует IP: пересоздали контейнер — фронт начинает стучаться по старому
    # адресу, где уже живёт чужой сервис, и получает 404 вместо ответа.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Весь API — через шлюз. Он и решает, куда идёт запрос: /api/auth и /api/users
    # в сервис аутентификации, каталог и прайсы в вынесенный Catalog, остальное пока
    # в монолит. Раскладывать маршруты здесь больше не нужно — это работа шлюза.
    location /api/ {
        # Имя в переменной — заставляет nginx резолвить его на каждом запросе,
        # а не один раз при старте. $request_uri обязателен: с переменной в proxy_pass
        # nginx не подставляет исходный путь автоматически.
        set $gateway_upstream http://gateway:8080;
        proxy_pass $gateway_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 64m;
    }
}
